name: Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir src/presentation install --frozen-lockfile
      - run: node --test test/*.test.js
      - run: pnpm audit --prod
      - run: docker build --tag digital-card-framework:ci .
