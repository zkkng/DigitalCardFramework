name: Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir src/presentation install --frozen-lockfile
      - run: pnpm test:sdk
      - run: node tools/generate-album-display.mjs --check
      - run: node tools/generate-editor-transforms.mjs --check
      - run: node tools/generate-opener-display.mjs --check
      - run: node --test test/*.test.js
        env:
          DC_TEST_PYTHON_PLUGIN: '1'
          PYTHON: python3
      - run: node docs/complex-cards/check-examples.mjs
      - run: pnpm audit --prod
      - run: pnpm --dir src/presentation audit --prod
      - run: node examples/card-policies.mjs
      - run: node examples/capabilities.mjs
      - run: node examples/full-line.mjs "$RUNNER_TEMP/full-line" --source-revision "$GITHUB_SHA" --base-url https://cards.example/content/
      - run: node examples/admin-headless.mjs
      - run: node examples/external-currency-provider.mjs
      - run: node examples/code-cards.mjs
      - run: node examples/trading-controls.mjs
      - run: node examples/card-actions.mjs
      - run: node examples/shops.mjs
      - run: node examples/raffles.mjs
      - run: docker build --tag digital-card-framework:ci .
      - run: node test/container-smoke.mjs
  receivers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/plugins/go-action-receiver/go.mod
          cache-dependency-path: examples/plugins/go-action-receiver/go.sum
      - run: go build -mod=readonly -buildvcs=false -trimpath -o "$RUNNER_TEMP/action-receiver" .
        working-directory: examples/plugins/go-action-receiver
      - run: node test/action-receiver-conformance.mjs "$RUNNER_TEMP/action-receiver" python3
      - run: node test/node-action-receiver-conformance.mjs
      - run: go -C examples/plugins/go-plugin-client build -mod=readonly -o "$RUNNER_TEMP/plugin-client" .
      - run: node test/plugin-purchase-conformance.mjs "$RUNNER_TEMP/plugin-client" python3
      - run: go -C examples/plugins/go-transfer-policy build -mod=readonly -buildvcs=false -trimpath -o "$RUNNER_TEMP/transfer-policy" .
      - run: node test/go-transfer-policy-conformance.mjs "$RUNNER_TEMP/transfer-policy"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node test/java-conformance.mjs
        env:
          JAVA: java
          JAVAC: javac
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: node test/csharp-conformance.mjs
        env:
          DOTNET: dotnet
      - run: rustup toolchain install 1.99.0 --profile minimal --no-self-update
      - run: cargo fetch --locked --manifest-path examples/plugins/rust-conformance/Cargo.toml
        env:
          RUSTUP_TOOLCHAIN: '1.99.0'
      - run: node test/rust-conformance.mjs
        env:
          CARGO: cargo
          RUSTUP_TOOLCHAIN: '1.99.0'
      - run: node --test test/editor-panel-examples.mjs
        env:
          PYTHON: python3
      - run: node --test test/localization-examples.mjs
      - run: node --test test/portable-card-art-examples.mjs
        env:
          PYTHON: python3
      - run: node --test test/portable-lottie-examples.mjs
        env:
          PYTHON: python3
      - run: node --test test/editor-transform-examples.mjs
        env:
          PYTHON: python3
      - run: node --test test/portable-program-examples.mjs
        env:
          PYTHON: python3
      - run: node --test test/live-editor-panel-examples.mjs
        env:
          PYTHON: python3
      - run: node --test test/collection-view-examples.mjs
        env:
          PYTHON: python3
      - run: node --test test/access-provider-examples.mjs
        env:
          PYTHON: python3
      - run: |
          go build -o "$RUNNER_TEMP/go-oidc-provider" test/fixtures/go-oidc-provider/main.go
          node test/oidc-host.test.mjs "$RUNNER_TEMP/go-oidc-provider"
        env:
          PYTHON: python3
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir src/presentation install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x2160x24" node test/program-marketplace-browser.mjs
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: xvfb-run --auto-servernum node test/portable-card-art-browser.mjs test-results/portable-card-art
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: xvfb-run --auto-servernum node test/presentation-audit-browser.mjs ./node_modules/playwright/index.mjs test-results ${{ matrix.engine }}
        env:
          HEADED: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          DC_CI_SOFTWARE_WEBGL: '1'
      - run: xvfb-run --auto-servernum node test/card-authoring-browser.mjs test-results/card-authoring
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: xvfb-run --auto-servernum node test/editor-contributions-browser.mjs test-results/editor-contributions
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
      - run: xvfb-run --auto-servernum node test/editor-contributions-browser.mjs test-results/editor-contributions-go
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          DC_EDITOR_LANGUAGE: go
      - run: xvfb-run --auto-servernum node test/program-collection-browser.mjs test-results/program-collection
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
      - run: xvfb-run --auto-servernum node test/program-shop-browser.mjs
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: xvfb-run --auto-servernum node test/program-trading-browser.mjs
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: xvfb-run --auto-servernum node test/application-shell-browser.mjs
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: xvfb-run --auto-servernum node test/program-editor-browser.mjs test-results/program-editor
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
      - run: xvfb-run --auto-servernum node test/editor-transforms-browser.mjs test-results/editor-transforms
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
          LIBGL_ALWAYS_SOFTWARE: '1'
          DC_CI_SOFTWARE_WEBGL: '1'
      - run: xvfb-run --auto-servernum node test/localization-browser.mjs test-results/localization
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: xvfb-run --auto-servernum node test/program-album-browser.mjs test-results/program-album
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: xvfb-run --auto-servernum node test/program-opener-browser.mjs test-results/program-opener
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
          DC_PROGRAM_LANGUAGES: python,go
      - run: xvfb-run --auto-servernum node test/program-pack-browser.mjs test-results/program-pack
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: xvfb-run --auto-servernum node test/program-card-browser.mjs test-results/program-card
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: xvfb-run --auto-servernum node test/portable-card-art-browser.mjs test-results/portable-card-art-go
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          DC_ART_LANGUAGE: go
      - run: xvfb-run --auto-servernum node test/presentation-host-browser.mjs --recipe test-results/presentation-host-recipe
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
      - run: xvfb-run --auto-servernum node test/presentation-host-browser.mjs --typography test-results/presentation-host-typography
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node test/prepare-rive-fixture.mjs test-results/rive-fixture
      - run: xvfb-run --auto-servernum node test/presentation-advanced-browser.mjs --gltf-rive test-results/advanced-media
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          RIVE_FIXTURE: test-results/rive-fixture/ball.riv
      - run: xvfb-run --auto-servernum node test/portable-lottie-browser.mjs test-results/portable-lottie
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
          LIBGL_ALWAYS_SOFTWARE: '1'
          DC_CI_SOFTWARE_WEBGL: '1'
      - run: xvfb-run --auto-servernum node test/album-artist-browser.mjs test-results/album-artist
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
      - run: xvfb-run --auto-servernum node test/wasm-pixels-browser.mjs
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: node test/codes-browser.mjs test-results/codes
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node test/codes-shell-browser.mjs test-results/codes-shell
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: node test/rewards-shell-browser.mjs test-results/rewards-shell
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: node test/trading-controls-shell-browser.mjs test-results/trading-controls-shell
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: node test/admin-shell-browser.mjs test-results/admin-shell
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: node test/command-recovery-browser.mjs
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node test/capabilities-browser.mjs
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node test/commerce-browser.mjs test-results/commerce
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node test/admin-browser.mjs test-results/admin
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          PYTHON: python3
      - run: xvfb-run --auto-servernum node test/presentation-resolution-browser.mjs test-results/resolution
        env:
          HEADED: '1'
          BROWSER_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.engine }}
          path: test-results/

  import-isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Delegate a disposable Linux cgroup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          group="/sys/fs/cgroup/digital-card-import-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir "$group"
          printf '+memory +pids' | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null
          printf '+memory +pids' | sudo tee "$group/cgroup.subtree_control" >/dev/null
          sudo mkdir "$group/host"
          sudo chown -R "$(id -u):$(id -g)" "$group"
          echo "DC_IMPORT_CGROUP_ROOT=$group" >> "$GITHUB_ENV"
      - name: Qualify required Linux import enforcement
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "$$" | sudo tee "$DC_IMPORT_CGROUP_ROOT/host/cgroup.procs" >/dev/null
          node --test test/presentation-import-isolation.test.js
        env:
          DC_REQUIRE_IMPORT_ISOLATION: '1'
      - name: Qualify required Windows import enforcement
        if: runner.os == 'Windows'
        run: node --test test/presentation-import-isolation.test.js
        env:
          DC_REQUIRE_IMPORT_ISOLATION: '1'
      - name: Remove disposable Linux cgroup
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          group="/sys/fs/cgroup/digital-card-import-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -d "$group" ]; then
            echo 1 | sudo tee "$group/cgroup.kill" >/dev/null
            sudo find "$group" -depth -type d -exec rmdir {} +
          fi
